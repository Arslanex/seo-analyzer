{% macro ico(name, size=18) %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'overview' %}<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>
{% elif name == 'chat' %}<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>
{% elif name == 'analysis' %}<path d="M4 20V11M10 20V5M16 20v-6M3 20h18"/>
{% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{% elif name == 'rivals' %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5M16 5a3.5 3.5 0 0 1 0 7"/>
{% elif name == 'plan' %}<path d="M4 6l2 2 3-3M12 7h8M4 14l2 2 3-3M12 15h8"/>
{% elif name == 'history' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'settings' %}<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7zM12 16v5"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'check' %}<path d="M5 12l5 5 9-10"/>
{% elif name == 'send' %}<path d="M12 19V5M6 11l6-6 6 6"/>
{% elif name == 'alert' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 17h.01"/>
{% elif name == 'chevron' %}<path d="M9 6l6 6-6 6"/>
{% endif %}
</svg>
{% endmacro %}

{% macro band_of(score) %}{{ 'good' if score >= 90 else ('attention' if score >= 75 else 'poor') }}{% endmacro %}
