{% macro sev_icon(shape) %}
<svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
{% if shape == 'octagon' %}
<polygon points="5,1 11,1 15,5 15,11 11,15 5,15 1,11 1,5" fill="currentColor"/><rect x="7.2" y="4" width="1.6" height="5.5" fill="var(--ico-ink)"/><rect x="7.2" y="10.6" width="1.6" height="1.6" fill="var(--ico-ink)"/>
{% elif shape == 'triangle' %}
<polygon points="8,1.5 15,14 1,14" fill="currentColor"/>
{% elif shape == 'diamond' %}
<polygon points="8,1 15,8 8,15 1,8" fill="currentColor"/>
{% elif shape == 'circle' %}
<circle cx="8" cy="8" r="6.5" fill="currentColor"/>
{% else %}
<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="7.2" y="7" width="1.6" height="4.5" fill="currentColor"/><rect x="7.2" y="4.5" width="1.6" height="1.6" fill="currentColor"/>
{% endif %}
</svg>
{% endmacro %}

{% macro sev_badge(sev, t, shapes) %}
<span class="sev sev-{{ sev }}">{{ sev_icon(shapes[sev]) }}<span>{{ t('sev.' ~ sev) }}</span></span>
{% endmacro %}

{% macro gauge(value, band, t) %}
{% set circ = 326.7 %}
<svg class="gauge" viewBox="0 0 120 120" width="112" height="112" role="img" aria-label="{{ value|num }} / 100">
<circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
<circle cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" stroke="var(--band-{{ band }})" stroke-dasharray="{{ (value / 100 * circ)|round(1) }} {{ circ }}" transform="rotate(-90 60 60)"/>
<text x="60" y="68" text-anchor="middle" font-size="30" font-weight="800" fill="currentColor">{{ value|num }}</text>
</svg>
{% endmacro %}
